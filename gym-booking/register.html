<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - FUSE Fitness</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B2D44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FUSE Fitness">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">FUSE<span>Fitness</span></a>
      <nav class="site-nav">
        <a href="schedule.html">Schedule</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <div class="auth-wrapper">
      <div class="card">
        <h1>Create Account</h1>
        <form id="register-form">
          <div class="form-group">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" required placeholder="Jane Smith">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="phone">Phone (optional)</label>
            <input type="tel" id="phone" placeholder="07700 900000">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Min 6 characters" minlength="6">
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" required placeholder="Repeat password" minlength="6">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;" id="register-btn">Create Account</button>
        </form>
        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Always attach the form handler first
      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('register-btn');

        const fullName = document.getElementById('full-name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        // Validate passwords match
        if (password !== confirmPassword) {
          showToast('Passwords do not match.', 'error');
          return;
        }

        setLoading(btn, true);

        try {
          const result = await signUp(email, password, fullName, phone);
          showToast('Account created! Redirecting...', 'success');
          // If session exists (email verification disabled), go straight to dashboard
          if (result.session) {
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
          } else {
            setTimeout(() => { window.location.href = 'login.html'; }, 1500);
          }
        } catch (err) {
          showToast(err.message, 'error');
          setLoading(btn, false);
        }
      });

      // If already logged in, redirect to dashboard
      try {
        const session = await getSession();
        if (session) {
          window.location.href = 'dashboard.html';
        }
      } catch {
        // Auth unavailable — stay on register page
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.warn('SW registration failed:', err));
    }
  </script>
</body>
</html>
