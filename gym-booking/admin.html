<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - FUSE Fitness</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">FUSE<span>Fitness</span></a>
      <nav class="site-nav">
        <a href="schedule.html">Schedule</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="admin.html">Admin</a>
        <a href="#" class="logout-btn">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <div id="admin-loading" class="spinner"></div>

    <div id="admin-content" style="display:none;">
      <h1 style="margin-bottom:1.25rem;">Admin Panel</h1>

      <!-- Stats row -->
      <div class="stats-row" id="admin-stats"></div>

      <div class="admin-layout">
        <!-- Left: Add/Edit class form -->
        <div>
          <div class="card class-form-card">
            <h2 id="form-title">Add New Class</h2>
            <form id="class-form">
              <input type="hidden" id="edit-class-id" value="">
              <div class="form-group">
                <label for="cls-title">Title</label>
                <input type="text" id="cls-title" required placeholder="e.g. Spin Class">
              </div>
              <div class="form-group">
                <label for="cls-instructor">Instructor</label>
                <input type="text" id="cls-instructor" required placeholder="e.g. Sarah J.">
              </div>
              <div class="form-group">
                <label for="cls-description">Description</label>
                <textarea id="cls-description" placeholder="Optional description..."></textarea>
              </div>
              <div class="form-group">
                <label for="cls-start">Start Time</label>
                <input type="datetime-local" id="cls-start" required>
              </div>
              <div class="form-group">
                <label for="cls-end">End Time</label>
                <input type="datetime-local" id="cls-end" required>
              </div>
              <div class="form-group">
                <label for="cls-capacity">Capacity</label>
                <input type="number" id="cls-capacity" required min="1" value="20">
              </div>
              <div class="form-group">
                <label for="cls-location">Location</label>
                <input type="text" id="cls-location" required placeholder="e.g. Studio 1">
              </div>
              <div style="display:flex;gap:0.5rem;">
                <button type="submit" class="btn btn-primary" id="form-submit">Add Class</button>
                <button type="button" class="btn btn-outline" id="form-reset" style="display:none;">Cancel Edit</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Right: Class list -->
        <div>
          <div class="card">
            <h2 style="margin-bottom:1rem;">All Classes</h2>
            <div class="table-wrap">
              <table class="class-table">
                <thead>
                  <tr>
                    <th>Title</th>
                    <th>Date/Time</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="class-list"></tbody>
              </table>
            </div>
          </div>

          <!-- Bookings viewer (shows when a class is selected) -->
          <div class="bookings-panel" id="bookings-panel" style="display:none;">
            <div class="card">
              <h3>Bookings for: <span id="bookings-class-name"></span></h3>
              <ul class="attendee-list" id="attendee-list"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      bindLogout();

      // Guard: only admins
      const profile = await requireAdmin();
      if (!profile) return;

      document.getElementById('admin-loading').style.display = 'none';
      document.getElementById('admin-content').style.display = '';

      await loadStats();
      await loadClasses();
      setupForm();
    });

    /** Load and render admin stats cards. */
    async function loadStats() {
      try {
        const stats = await fetchAdminStats();
        document.getElementById('admin-stats').innerHTML = `
          <div class="card stat-card">
            <div class="stat-value">${stats.bookingsToday}</div>
            <div class="stat-label">Bookings Today</div>
          </div>
          <div class="card stat-card">
            <div class="stat-value">${stats.classesThisWeek}</div>
            <div class="stat-label">Classes This Week</div>
          </div>
          <div class="card stat-card">
            <div class="stat-value">${stats.totalMembers}</div>
            <div class="stat-label">Members</div>
          </div>`;
      } catch (err) {
        showToast('Failed to load stats.', 'error');
      }
    }

    /** Load and render the full class list in the table. */
    async function loadClasses() {
      try {
        const classes = await fetchAllClasses();
        const tbody = document.getElementById('class-list');

        if (!classes.length) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--color-text-muted);">No classes yet.</td></tr>';
          return;
        }

        tbody.innerHTML = classes.map(c => `
          <tr>
            <td><strong>${escapeHtml(c.title)}</strong><br><small>${escapeHtml(c.instructor)}</small></td>
            <td>${formatDateTime(c.start_time)}</td>
            <td>${escapeHtml(c.location)}</td>
            <td>${c.is_cancelled
              ? '<span class="badge badge-cancelled">Cancelled</span>'
              : '<span class="badge badge-confirmed">Active</span>'}</td>
            <td class="actions">
              <button class="btn btn-sm btn-outline" onclick="editClass('${c.id}')">Edit</button>
              <button class="btn btn-sm ${c.is_cancelled ? 'btn-primary' : 'btn-danger'}"
                onclick="toggleCancel('${c.id}', ${!c.is_cancelled})">
                ${c.is_cancelled ? 'Restore' : 'Cancel'}
              </button>
              <button class="btn btn-sm btn-secondary" data-title="${escapeHtml(c.title)}"
                onclick="viewBookings('${c.id}', this.dataset.title)">Bookings</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        showToast('Failed to load classes.', 'error');
      }
    }

    /** Set up the add/edit class form. */
    function setupForm() {
      const form = document.getElementById('class-form');
      const resetBtn = document.getElementById('form-reset');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('form-submit');
        setLoading(submitBtn, true);

        const startTime = new Date(document.getElementById('cls-start').value);
        const endTime = new Date(document.getElementById('cls-end').value);

        if (endTime <= startTime) {
          showToast('End time must be after start time.', 'error');
          setLoading(submitBtn, false);
          return;
        }

        const classData = {
          title: document.getElementById('cls-title').value.trim(),
          instructor: document.getElementById('cls-instructor').value.trim(),
          description: document.getElementById('cls-description').value.trim(),
          start_time: startTime.toISOString(),
          end_time: endTime.toISOString(),
          capacity: parseInt(document.getElementById('cls-capacity').value, 10),
          location: document.getElementById('cls-location').value.trim()
        };

        const editId = document.getElementById('edit-class-id').value;

        try {
          if (editId) {
            await updateClass(editId, classData);
            showToast('Class updated.', 'success');
          } else {
            await createClass(classData);
            showToast('Class created.', 'success');
          }
          resetForm();
          await loadClasses();
          await loadStats();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setLoading(submitBtn, false);
        }
      });

      resetBtn.addEventListener('click', resetForm);
    }

    /** Populate the form with existing class data for editing. */
    async function editClass(classId) {
      try {
        const { data: cls, error } = await supabase
          .from('classes')
          .select('*')
          .eq('id', classId)
          .single();

        if (error) throw error;

        document.getElementById('edit-class-id').value = cls.id;
        document.getElementById('cls-title').value = cls.title;
        document.getElementById('cls-instructor').value = cls.instructor;
        document.getElementById('cls-description').value = cls.description || '';
        document.getElementById('cls-start').value = cls.start_time.slice(0, 16);
        document.getElementById('cls-end').value = cls.end_time.slice(0, 16);
        document.getElementById('cls-capacity').value = cls.capacity;
        document.getElementById('cls-location').value = cls.location;

        document.getElementById('form-title').textContent = 'Edit Class';
        document.getElementById('form-submit').textContent = 'Save Changes';
        document.getElementById('form-reset').style.display = '';

        // Scroll to form on mobile
        document.getElementById('class-form').scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        showToast('Failed to load class for editing.', 'error');
      }
    }

    /** Reset the form back to "Add" mode. */
    function resetForm() {
      document.getElementById('class-form').reset();
      document.getElementById('edit-class-id').value = '';
      document.getElementById('form-title').textContent = 'Add New Class';
      document.getElementById('form-submit').textContent = 'Add Class';
      document.getElementById('form-reset').style.display = 'none';
    }

    /** Toggle cancel/restore on a class. */
    async function toggleCancel(classId, cancel) {
      const action = cancel ? 'cancel' : 'restore';
      if (!confirmAction(`Are you sure you want to ${action} this class?`)) return;

      try {
        await toggleCancelClass(classId, cancel);
        showToast(`Class ${action}led.`, 'success');
        await loadClasses();
        await loadStats();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    /** Show the bookings panel for a specific class. */
    async function viewBookings(classId, className) {
      const panel = document.getElementById('bookings-panel');
      const list = document.getElementById('attendee-list');

      document.getElementById('bookings-class-name').textContent = className;
      panel.style.display = '';
      list.innerHTML = '<li>Loading...</li>';

      try {
        const bookings = await fetchClassBookings(classId);

        if (!bookings.length) {
          list.innerHTML = '<li style="color:var(--color-text-muted);">No bookings yet.</li>';
          return;
        }

        list.innerHTML = bookings.map(b => {
          const p = b.profiles;
          const badgeClass = b.status === 'confirmed' ? 'badge-confirmed' : 'badge-waitlist';
          return `<li>
            <strong>${p ? escapeHtml(p.full_name) : 'Unknown'}</strong>
            ${p && p.phone ? ` &middot; ${escapeHtml(p.phone)}` : ''}
            &middot; <span class="badge ${badgeClass}">${escapeHtml(b.status)}</span>
            <small style="color:var(--color-text-muted);margin-left:0.5rem;">
              Booked ${formatDateTime(b.booked_at)}
            </small>
          </li>`;
        }).join('');
      } catch (err) {
        list.innerHTML = '<li style="color:var(--color-danger);">Failed to load bookings.</li>';
      }
    }
  </script>
</body>
</html>
