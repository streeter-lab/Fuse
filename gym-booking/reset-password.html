<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - FUSE Fitness</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B2D44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FUSE Fitness">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">FUSE<span>Fitness</span></a>
      <nav class="site-nav">
        <a href="schedule.html">Schedule</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <div class="auth-wrapper">
      <div class="card">
        <h1>Set New Password</h1>

        <div id="reset-loading" class="spinner"></div>

        <form id="reset-form" style="display:none;">
          <div class="form-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" required placeholder="Min 6 characters" minlength="6">
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" required placeholder="Repeat password" minlength="6">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;" id="reset-btn">Update Password</button>
        </form>

        <div id="reset-error" style="display:none;text-align:center;">
          <p style="color:var(--color-danger);font-weight:600;margin-bottom:0.5rem;">Invalid or Expired Link</p>
          <p style="color:var(--color-text-muted);font-size:0.9rem;margin-bottom:1rem;">This password reset link is no longer valid. Please request a new one.</p>
          <a href="forgot-password.html" class="btn btn-primary">Request New Link</a>
        </div>

        <div class="auth-footer">
          <a href="login.html">Back to Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let recoveryDetected = false;

      // Listen for the PASSWORD_RECOVERY event from Supabase
      supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
          recoveryDetected = true;
          document.getElementById('reset-loading').style.display = 'none';
          document.getElementById('reset-form').style.display = '';
        }
      });

      // Timeout: if no recovery event after 3 seconds, show error
      setTimeout(() => {
        if (!recoveryDetected) {
          document.getElementById('reset-loading').style.display = 'none';
          document.getElementById('reset-error').style.display = '';
        }
      }, 3000);

      // Handle form submission
      document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('reset-btn');

        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (newPassword !== confirmPassword) {
          showToast('Passwords do not match.', 'error');
          return;
        }

        setLoading(btn, true);

        try {
          const { error } = await supabase.auth.updateUser({ password: newPassword });
          if (error) throw error;
          showToast('Password updated successfully!', 'success');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
        } catch (err) {
          showToast(err.message || 'Failed to update password.', 'error');
          setLoading(btn, false);
        }
      });
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.warn('SW registration failed:', err));
    }
  </script>
</body>
</html>
