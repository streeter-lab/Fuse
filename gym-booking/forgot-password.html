<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - FUSE Fitness</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B2D44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FUSE Fitness">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">FUSE<span>Fitness</span></a>
      <nav class="site-nav">
        <a href="schedule.html">Schedule</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <div class="auth-wrapper">
      <div class="card">
        <h1>Reset Password</h1>
        <p style="text-align:center;color:var(--color-text-muted);margin-bottom:1.5rem;font-size:0.9rem;">
          Enter your email address and we'll send you a link to reset your password.
        </p>
        <form id="forgot-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@example.com">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;" id="forgot-btn">Send Reset Link</button>
        </form>
        <div id="success-message" style="display:none;text-align:center;margin-top:1.5rem;">
          <p style="color:var(--color-success);font-weight:600;margin-bottom:0.5rem;">Check your email</p>
          <p style="color:var(--color-text-muted);font-size:0.9rem;">If an account exists with that email, you'll receive a reset link.</p>
        </div>
        <div class="auth-footer">
          <a href="login.html">Back to Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('forgot-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('forgot-btn');
        setLoading(btn, true);

        const email = document.getElementById('email').value.trim();

        try {
          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/reset-password.html'
          });
          if (error) throw error;
        } catch (err) {
          // Don't reveal whether account exists - show success regardless
          console.error('Reset email error:', err);
        }

        // Always show success message (don't reveal if account exists)
        document.getElementById('forgot-form').style.display = 'none';
        document.getElementById('success-message').style.display = '';
      });
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.warn('SW registration failed:', err));
    }
  </script>
</body>
</html>
